default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        stages:
          - pre-commit

      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        stages:
          - pre-commit

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        stages:
          - pre-commit

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push

      - id: zensical-build
        name: zensical build
        entry: uv run zensical build
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
