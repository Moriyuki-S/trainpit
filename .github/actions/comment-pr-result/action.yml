name: Comment PR result
description: Upsert a GitHub Actions result comment on a pull request.

inputs:
  marker:
    description: Stable marker used to find and update the PR comment.
    required: true
  title:
    description: Comment heading.
    required: true
  outcome:
    description: Job outcome to show in the comment.
    required: true
  details:
    description: Additional markdown details for the result.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Upsert result comment
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        script: |
          const markerName = core.getInput("marker");
          const title = core.getInput("title");
          const outcome = core.getInput("outcome");
          const details = core.getInput("details").trim();
          const marker = `<!-- trainpit-ci:${markerName} -->`;

          const statusByOutcome = {
            success: "success",
            failure: "failure",
            cancelled: "cancelled",
            skipped: "skipped",
          };
          const status = statusByOutcome[outcome] ?? outcome;
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const shortSha = context.sha.slice(0, 7);

          const body = [
            marker,
            `### ${title}`,
            "",
            `Status: **${status}**`,
            `Workflow: \`${context.workflow}\``,
            `Run: [${context.runNumber}](${runUrl})`,
            `Commit: \`${shortSha}\``,
            details ? "" : null,
            details || null,
          ].filter((line) => line !== null).join("\n");

          const issue_number = context.payload.pull_request.number;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number,
            per_page: 100,
          });

          const existing = comments.find((comment) =>
            comment.user?.type === "Bot" && comment.body?.includes(marker)
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
            return;
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number,
            body,
          });
