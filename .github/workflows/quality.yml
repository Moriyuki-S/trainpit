name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v6

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        id: setup_uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 
        with:
          enable-cache: true

      - name: Validate lockfile
        id: validate_lockfile
        run: uv lock --check

      - name: Install dependencies
        id: install_dependencies
        run: uv sync --locked --all-extras --dev

      - name: Check formatting
        id: check_formatting
        run: uv run ruff format --check .

      - name: Lint
        id: lint
        run: uv run ruff check .

      - name: Compile Python files
        id: compile_python_files
        run: uv run python -m compileall main.py src tests

      - name: Build package
        id: build_package
        run: uv build

      - name: Verify wheel installs
        id: verify_wheel_installs
        shell: bash
        run: |
          wheel_test_env="$(mktemp -d)"
          python3 -m venv "$wheel_test_env"
          "$wheel_test_env/bin/python" -m pip install dist/*.whl
          "$wheel_test_env/bin/python" - <<'PY'
          from importlib.metadata import metadata

          import trainpit

          assert trainpit.__name__ == "trainpit"
          assert metadata("trainpit")["Name"] == "trainpit"
          PY

      - name: Comment PR result
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: ./.github/actions/comment-pr-result
        with:
          marker: quality
          title: Quality
          outcome: ${{ job.status }}
          details: |
            Results:
            - Checkout: `${{ steps.checkout.outcome }}`
            - Python setup: `${{ steps.setup_python.outcome }}`
            - uv setup: `${{ steps.setup_uv.outcome }}`
            - Lockfile: `${{ steps.validate_lockfile.outcome }}`
            - Dependency install: `${{ steps.install_dependencies.outcome }}`
            - Format: `${{ steps.check_formatting.outcome }}`
            - Lint: `${{ steps.lint.outcome }}`
            - Compile: `${{ steps.compile_python_files.outcome }}`
            - Build: `${{ steps.build_package.outcome }}`
            - Wheel install: `${{ steps.verify_wheel_installs.outcome }}`
