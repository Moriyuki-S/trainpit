name: Coverage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v6

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        id: setup_uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true

      - name: Install dependencies
        id: install_dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run coverage
        id: run_coverage
        run: uv run pytest --cov=trainpit --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        id: upload_coverage_report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Comment PR result
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: ./.github/actions/comment-pr-result
        with:
          marker: coverage
          title: Coverage
          outcome: ${{ job.status }}
          details: |
            Results:
            - Checkout: `${{ steps.checkout.outcome }}`
            - Python setup: `${{ steps.setup_python.outcome }}`
            - uv setup: `${{ steps.setup_uv.outcome }}`
            - Dependency install: `${{ steps.install_dependencies.outcome }}`
            - Coverage: `${{ steps.run_coverage.outcome }}`
            - Coverage artifact upload: `${{ steps.upload_coverage_report.outcome }}`
            Artifact:
            - `coverage-xml`
